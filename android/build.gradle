buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Update to a modern Android Gradle Plugin version compatible with Gradle 8.10.2
        classpath 'com.android.tools.build:gradle:8.6.0'
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 34
    namespace 'com.lx.reactnative.bluetoothprinter' 

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34 
        versionCode 1
        versionName "1.0"
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    
    lintOptions {
        abortOnError false
    }
    
    sourceSets {
        main {
            aidl.srcDirs = ['src/main/java']
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven {
        // React Native from npm
        url "$rootDir/../node_modules/react-native/android"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // Use provided dependency to avoid version conflicts
    compileOnly 'com.facebook.react:react-native:+'
    // Replace support library with AndroidX
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.zxing:core:3.5.3' 
}